name: Accessibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  axe-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Serve index.html
        run: python3 -m http.server 7821 &
      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:7821 > /dev/null && break
            sleep 1
          done
      # @axe-core/cli drives a headless Chrome itself — no persistent
      # dependency added to this repo, matching the zero-runtime-dependency
      # constraint documented in docs/ARCHITECTURE.md §1. This checks the
      # page's structural/static accessibility (landmarks, labels, contrast,
      # focus order) — it can't exercise every localStorage-driven view a
      # real visit populates, but it's a real, machine-checked floor under
      # the accessibility claims in docs/DESIGN.md §6, not just a written
      # assertion.
      #
      # --load-delay 800: every .tab-panel plays a 200ms fadeIn on mount, and
      # axe's default synchronous snapshot can catch it mid-fade (opacity 0),
      # which reads as a false-positive contrast failure on nearly every
      # visible text node. The first real scan reported 71 violations for
      # exactly this reason; only 3 were real (--text-tertiary/.ss-tile .l
      # against --bg-tertiary, ~3.97:1 vs WCAG AA's 4.5:1). Both are fixed —
      # see docs/KNOWN_ISSUES.md for the full story.
      #
      # --chrome-options: standard headless-Chrome-under-CI sandbox flags.
      #
      # @axe-core/cli drives Chrome through selenium-webdriver + the npm
      # `chromedriver` package, which bundles its own pinned chromedriver
      # binary. The runner's system Chrome is on its own, newer release
      # train, so the two mismatch and Selenium throws SessionNotCreatedError
      # ("This version of ChromeDriver only supports Chrome version X") —
      # surfaced as a generic exit code 2, not a real violations report
      # (which is exit code 1). This — not a contrast regression — is why
      # the job first failed after being flipped to blocking; it was masked
      # entirely while the job was non-blocking. browser-driver-manager
      # (also npx, no persistent dependency) installs a matched Chrome +
      # chromedriver pair before the scan runs, which is the exact fix
      # axe-core's own error message names.
      - name: Sync Chrome + chromedriver versions
        run: npx --yes browser-driver-manager install chrome
      - name: axe-core scan (WCAG 2 A/AA)
        run: npx --yes @axe-core/cli@latest http://localhost:7821 --tags wcag2a,wcag2aa --load-delay 800 --chrome-options="no-sandbox,disable-setuid-sandbox,disable-dev-shm-usage" --exit
